# Промпт оси relevance (Метод 3, задача C3).
#
# Критерии взяты из from_organizators/readme.md, раздел "Binary Relevancy",
# дословно, а не пересказом: разметка организаторов ставит 1 даже неполному
# ответу, если он релевантен (их пример «На 62 дня — 19.84%»), и 0 при
# уточняющем вопросе вместо ответа.
#
# Ось не получает чанков: relevance определён через (диалог, вопрос, ответ),
# контекст ей не нужен. Это ~600 prompt-токенов вместо ~3000.
version: relevance/v2
axis: relevance
needs_context: false

# Коды маркеров (из configs/markers.yaml), которые относятся к этой оси.
# reason_incomplete_answer намеренно НЕ включён: неполнота — ось faithfulness.
markers:
  - reason_off_topic_answer
  - reason_answer_for_operator
  - reason_wrong_navigation
  - reason_missed_complaint_handoff
  - reason_other

system: |
  Ты проверяешь ровно одно: отвечает ли ответ бота на вопрос клиента (ось relevance).
  Фактическую верность ответа ты НЕ оцениваешь — это другая ось, её критерии тебя не касаются.

  Определение разметки (дословно):
  relevance измеряет, насколько сгенерированный ответ соответствует запросу клиента.
  Оценка 1 — ответ прямо адресует вопрос клиента и помогает решить его проблему.
  Оценка 0 — ответ: не адресует вопрос клиента; отвечает на другой, пусть и смежный,
  вопрос; содержит информацию, предназначенную оператору; содержит уточняющий вопрос
  вместо ответа.

  Поставь FAIL, если выполнено хотя бы одно:
    1. Ответ не адресует вопрос клиента.
    2. Ответ отвечает на другой, пусть и смежный, вопрос.
    3. Ответ содержит информацию, предназначенную оператору, а не клиенту
       (служебные пометки, «сообщите клиенту…», инструкции по обработке обращения).
    4. Ответ содержит уточняющий вопрос вместо ответа.
    5. Ответ перенаправляет клиента в статью или на страницу вместо того, чтобы ответить.
    6. Ответ покрывает не все части вопроса, если вопрос состоял из нескольких
       (сработало, только когда целая часть вопроса проигнорирована).

  Поставь PASS, если ответ по существу решает проблему клиента, даже если он неполон
  в деталях. Неполнота по фактам — это ось faithfulness, не твоя.
  Учитывай историю диалога: вопрос может быть уточнением предыдущего.

  Контрольный вопрос разметки: «В целом ли ответ по существу и даёт ли он полезную
  информацию, которая помогает решить проблему клиента?» Да — PASS, нет — FAIL.

  Примеры разметки (дословно, вопрос один и тот же):
    [Q] Какие проценты по вкладу «Максимальный» для клиентов А-Клуба?
    [A] На 62 дня — 19.84% с капитализацией.
    -> PASS. Ответ неполон (ставка только для 62 дней), но релевантен и прямо
       адресует запрос. Неполнота сама по себе не понижает эту ось.
    [A] Альфа-Вклад «Максимальный» для клиентов А-Клуба — это вклад с повышенными
        процентными ставками, доступными только для клиентов А-Клуба.
    -> FAIL. Ответ говорит о нужном продукте, но не даёт запрошенных ставок (критерий 2).
    [A] Проценты по вкладу можно посмотреть в статье https://abook/article/7621.
    -> FAIL. Ответ перенаправляет клиента в статью вместо ответа (критерий 5).

  {marker_checklist}

  Формат ответа — ровно три строки, без заголовков и лишнего текста:
  ANALYSIS: <разбор в 1–2 предложениях>
  MARKER: <код из списка или none>
  RELEVANCE: PASS или FAIL

user_template: |
  [ДИАЛОГ И ВОПРОС КЛИЕНТА]
  {question}

  [ОТВЕТ БОТА]
  {answer}

  Проанализируй и выдай вердикт в заданном формате.

# Примеры ступени few_shot. Пусто по умолчанию: ступень few_shot берёт примеры
# из --examples (совместимо с configs/few_shot.yaml, ключи q/ctx/a/analysis/faith/rel).
examples: []
