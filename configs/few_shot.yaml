# 7 примеров ступени few_shot из РЕАЛЬНОГО корпуса (alfa_dev_train; не из val/test).
# Покрытие: 2×reliable, hallucinated_fact, incomplete_answer, answer_for_operator,
# ячейка (faith=1, rel=0) — якорь осей, chunk_fact_mixup. Контексты сокращены до
# релевантных фрагментов; PII уже маскирована кураторами ([NAME]/[NUMBER]/[URL]).
# «analysis» написан вручную. Источники: id кейсов в комментариях.
examples:
  # 1. reliable — alfa_54ecf1f19a0b
  - q: "Как мне отключить автоплатёж"
    ctx: |
      [Чанк 1] Автоплатёж (по балансу и расписанию). ## 8. Удаление автоплатежа. Действия: 1. На главной странице или в разделе «Платежи» перейдите в «Мои платежи». 2. Перейдите в раздел «с автоплатежом». 3. Нажмите на автоплатёж и выберите «Удалить». После удаления автоплатежа перестанем автоматически производить оплату.
      [Чанк 2] Автоплатёж. ## 7. Приостановка автоплатежа по расписанию. Автоплатёж перейдёт в статус «На паузе».
    a: "Чтобы отключить автоплатёж в мобильном приложении Альфа-Банка: 1) Откройте раздел «Платежи» → «Мои платежи». 2) Перейдите в «с автоплатежом». 3) Выберите нужный автоплатёж и нажмите «Удалить». После этого автоматические платежи перестанут списываться."
    analysis: "Шаги дословно совпадают с разделом «Удаление автоплатежа» из чанка 1, ответ прямо решает запрос клиента «отключить»."
    faith: "PASS"
    rel: "PASS"

  # 2. reliable — alfa_63bfd81a4299
  - q: "У меня кредитная карта. Беспроцентный период заканчивается завтра. До которого часа завтра я могу пополнить карту?"
    ctx: |
      [Чанк 1] Кредитная карта «60 дней без %». ## Погашение. Клиент может погасить всю задолженность в любой момент без комиссии. Рекомендуем внести деньги до 22:00 мск. В период с 6:00 мск до 22:00 погашение произойдёт в течение 5 минут после внесения. В период с 22:00 до 6:00 мск погашение фактической задолженности произойдёт в 6:00 мск.
    a: "Для избежания процентов рекомендуем пополнить кредитную карту до 22:00 по московскому времени. Если внести средства в этот период, списание произойдет в течение 5 минут. Если пополнение произойдет после 22:00, оно будет обработано не позднее 6:00 следующего дня."
    analysis: "Время 22:00, «в течение 5 минут» и обработка в 6:00 подтверждены чанком; ответ отвечает именно на вопрос о часе пополнения."
    faith: "PASS"
    rel: "PASS"

  # 3. hallucinated_fact — alfa_6ae0f5561c54 (faith=FAIL, rel=PASS)
  - q: "Если я сейчас подключу подписку Альфа-Смарт, то лимит бонусов за декабрь повысится?"
    ctx: |
      [Чанк 1] Уровень Альфа-Смарт. ## Как воспользоваться. Увеличенный лимит на кэшбэк: кэшбэк начисляем по лучшим условиям внутри месяца. Если уровень был активен хотя бы 1 день в месяце, применим лимит [NUMBER] или [NUMBER] в зависимости от условий.
      [Чанк 2] Программа лояльности для клиентов (категории и барабан). ## 2. Ежемесячные изменения. Лимиты по карте: Mass — [NUMBER], Альфа-Смарт — [NUMBER], Alfa Only — [NUMBER].
    a: "Да, если вы подключите подписку Альфа-Смарт до 15 декабря, ваш лимит кэшбэка за декабрь увеличится с [NUMBER] ₽ до [NUMBER] ₽. Это относится ко всем категориям кэшбэка (включая акции и обычные покупки). Подписка должна быть активна к 15 декабря для учёта в этом месяце."
    analysis: "В ответе выдумано условие «до 15 декабря» и утверждение «ко всем категориям» — в чанках его нет; чанк 1 говорит «активен хотя бы 1 день в месяце». Подменённый факт — FAITHFULNESS: FAIL; на сам вопрос ответ по существу отвечает — RELEVANCE: PASS."
    faith: "FAIL"
    rel: "PASS"

  # 4. incomplete_answer — alfa_4298406cdd65 (faith=FAIL, rel=PASS)
  - q: "Когда будет решен вопрос по возврату комиссии за услугу которую я не подключал"
    ctx: |
      [Чанк 1] Подача обращений из «Истории операций». ## 4. Процесс оспаривания комиссии. Ограничения по комиссиям: 1. Оспаривать можно комиссии за последние 12 месяцев (холды не оспариваются). 2. В одном обращении — одна комиссия.
      [Чанк 2] Оформление обращений с типом «Комиссии». В поле «Период возмещения» укажи, с какой по какую дату клиент оспаривает комиссию.
    a: "Ответ по вашему обращению о возврате комиссии доступен в разделе [Обращения в банк]([URL]). Если комиссия не вернётся автоматически, решение будет принято в течение 2-4 рабочих дней. Проверьте статус обращения в приложении."
    analysis: "Опущены важные ограничения из чанка 1 (оспаривание только за 12 месяцев, холды не оспариваются), а срок «2-4 рабочих дней» контекстом не подтверждён — ответ неполный и вводит в заблуждение: FAITHFULNESS: FAIL; тема вопроса выдержана — RELEVANCE: PASS."
    faith: "FAIL"
    rel: "PASS"

  # 5. answer_for_operator — alfa_37470919d4b5 (faith=FAIL, rel=FAIL)
  - q: "Закрыть зарплатный счет"
    ctx: |
      [Чанк 1] Закрытие дебетовых счетов в приложении Альфа-Банка. 1. Кнопка «Закрыть счёт» на экране деталей счёта. 2. При нажатии — предупреждающий экран.
      [Чанк 2] Закрытие счёта в SFA-Call (внутренняя инструкция). ## 1. Условия закрытия счетов. Сотрудникам банка для начисления зарплаты открываем счета типа GZ. Данные счета не показываем в SFA-Call. Закрытие такого счёта возможно только при обращении клиента.
    a: "Зарплатный счёт (GZ) можно закрыть только в отделении Альфа-Банка. Через мобильное приложение эту операцию выполнить нельзя. Рекомендую обратиться в ближайшее отделение банка с паспортом для оформления закрытия счёта."
    analysis: "Ответ построен на внутренней инструкции для оператора (SFA-Call, счета GZ — это счета сотрудников банка) и не применим к клиенту; утверждение «только в отделении с паспортом» контекстом не подтверждено. FAITHFULNESS: FAIL и RELEVANCE: FAIL — клиенту не дан ответ на его запрос."
    faith: "FAIL"
    rel: "FAIL"

  # 6. ячейка (faith=1, rel=0) — alfa_425b2ff5fc08 — ЯКОРЬ независимости осей
  - q: "Программа долгосрочных сбережений для пенсионеров до какого возраста?"
    ctx: |
      [Чанк 1] Программа долгосрочных сбережений (ПДС). ## Параметры. Варианты выплат: Единовременная выплата — через 15 лет, вне зависимости от возраста, либо после наступления возраста 55 лет для женщин или 60 лет для мужчин, если размер пожизненных периодических выплат менее 10% прожиточного минимума пенсионера.
    a: "Программа долгосрочных сбережений (ПДС) предусматривает единовременную выплату после наступления возраста 55 лет (для женщин) или 60 лет (для мужчин), но только если размер пожизненных периодических выплат составит менее 10% прожиточного минимума пенсионера в РФ ([NUMBER] ₽ на 2025 год)."
    analysis: "Все факты ответа подтверждены чанком (55/60 лет, условие 10% прожиточного минимума) — FAITHFULNESS: PASS. Но клиент спрашивал про верхний предел возраста для вступления, а ответ описывает условия выплат и не отвечает на вопрос: RELEVANCE: FAIL. Оси независимы."
    faith: "PASS"
    rel: "FAIL"

  # 7. chunk_fact_mixup — alfa_8dd657dc4401 (faith=FAIL, rel=PASS)
  - q: "Мне бабушка перевела деньги, в истории перевода они есть, а на карте нету"
    ctx: |
      [Чанк 1] История операций в приложении Альфа-Банка. ## 1. История операций. Операции по закрытым счетам в истории операций не отображаем.
      [Чанк 2] История операций в Альфа-Онлайн. В разделе «История» можно посмотреть операции по всем счетам и картам за последние 13 календарных месяцев.
    a: "Перевод может отображаться в истории операций раньше, чем зачислится на карту. Проверьте статус операции: если рядом с суммой есть иконка «Часы», перевод находится в обработке (ожидайте до нескольких часов). Попробуйте обновить историю операций — потяните список вниз."
    analysis: "Утверждения про иконку «Часы», ожидание «до нескольких часов» и «потяните список вниз» отсутствуют в приведённых чанках — сведения смешаны из другого раздела документации: FAITHFULNESS: FAIL. Ответ по теме вопроса клиента — RELEVANCE: PASS."
    faith: "FAIL"
    rel: "PASS"
