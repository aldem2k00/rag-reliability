# Реальная таксономия 13 маркеров кураторов (глоссы — дословный перевод из
# data/readme.md). Используется GEPA-feedback'ом (run_gepa.load_marker_gloss)
# и анализом; ключи должны совпадать со значениями в колонке markers корпуса.
reason_hallucinated_fact: "модель галлюцинировала неверный факт"
reason_off_topic_answer: "модель ответила на другой вопрос вместо запроса пользователя"
reason_irrelevant_chunk_used: "ответ сгенерирован по нерелевантному чанку знаний"
reason_chunk_fact_mixup: "модель неверно объединила факты из нескольких чанков"
reason_incomplete_answer: "ответ неполный, опущена важная информация"
reason_false_verification: "модель ложно заявила о проверке информации или выполненном расчёте"
reason_outdated_fact: "использована устаревшая информация"
reason_answer_for_operator: "ответ содержит информацию, предназначенную оператору, а не клиенту"
reason_other: "другая причина"
reason_reveals_ai_identity: "модель раскрыла или дала понять, что ответ сгенерирован ИИ"
reason_wrong_navigation: "модель направила пользователя в неверную статью/ресурс/раздел"
reason_missed_complaint_handoff: "модель не распознала жалобу и не эскалировала диалог"
reason_missed_chunk_conditions: "модель не использовала верные условия из релевантного чанка, хотя они были доступны"
